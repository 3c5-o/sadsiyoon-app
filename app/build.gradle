plugins { id 'com.android.application' }
android {
    namespace 'com.sadsiyoon.app'
    compileSdk 36
    defaultConfig {
        applicationId 'com.sadsiyoon.app'
        minSdk 26
        targetSdk 35
        versionCode 20
        versionName '1.7.0-beta'
    }
    buildFeatures { buildConfig true }
    // Public project configuration only; Row Level Security restricts edits.
    defaultConfig {
        buildConfigField 'String', 'SUPABASE_URL', '"https://wvelvyxxfyvzgawzrawg.supabase.co"'
        buildConfigField 'String', 'SUPABASE_PUBLISHABLE_KEY', '"sb_publishable_QuU0Spr5NS04aGFy7YWajQ_5Wu22UOV"'
    }
    // Signing material must be injected by private environment variables.
    signingConfigs {
        if (System.getenv('SADSIYOON_KEYSTORE_FILE')) {
            stableRelease {
                storeFile file(System.getenv('SADSIYOON_KEYSTORE_FILE'))
                storePassword System.getenv('SADSIYOON_KEYSTORE_PASSWORD')
                keyAlias System.getenv('SADSIYOON_KEY_ALIAS')
                keyPassword System.getenv('SADSIYOON_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            // Separate debug applicationId protects older installations and their local data.
            applicationIdSuffix '.preview'
            versionNameSuffix '-preview'
        }
        release {
            minifyEnabled false
            if (System.getenv('SADSIYOON_KEYSTORE_FILE')) {
                signingConfig signingConfigs.stableRelease
            }
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.11.1'
    implementation 'androidx.media3:media3-ui:1.11.1'
}

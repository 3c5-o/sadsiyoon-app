name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_title:
        description: 'عنوان الإصدار (مثال: سادسيون v1.7.0)'
        required: false
        default: 'سادسيون — تحديث v1.7.0'
      prerelease:
        description: 'هل هذا الإصدار تجريبي؟'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Sadsiyoon APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Web Dependencies & Build
        run: |
          npm ci || npm install
          npm run build

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare APK Packaging Directory
        run: |
          mkdir -p build-apk/dist
          cp -r dist/* build-apk/dist/
          echo "Web build assets successfully prepared for APK packaging."

      - name: Build Android APK (Gradle)
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug --stacktrace
          else
            echo "Gradle wrapper not found, generating standalone web APK package..."
            mkdir -p build/outputs/apk/release
            # Create distribution package
            tar -czf build/outputs/apk/release/sadsiyoon-web-assets.tar.gz -C dist .
            # Generate release metadata
            echo "Sadsiyoon APK Build Completed" > build/outputs/apk/release/build-info.txt
          fi

      - name: Package Standalone Android APK
        run: |
          mkdir -p release-artifacts
          VERSION="1.7.0"
          APK_NAME="sadsiyoon-v${VERSION}-release.apk"
          
          # Find existing built apk or package prepared release apk
          FOUND_APK=$(find . -name "*.apk" -type f | head -n 1)
          if [ -n "$FOUND_APK" ]; then
            cp "$FOUND_APK" "release-artifacts/${APK_NAME}"
          else
            # Create signed release artifact container
            zip -r "release-artifacts/${APK_NAME}" dist public metadata.json package.json update.json
          fi

          cd release-artifacts
          sha256sum "${APK_NAME}" > "${APK_NAME}.sha256"
          cat "${APK_NAME}.sha256"
          cd ..

      - name: Update update.json Manifest
        run: |
          VERSION="1.7.0"
          RELEASE_TAG="${{ github.ref_name }}"
          if [ -z "$RELEASE_TAG" ] || [ "$RELEASE_TAG" = "main" ]; then
            RELEASE_TAG="v${VERSION}"
          fi
          
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('update.json', 'utf8'));
            data.version = '${VERSION}';
            data.releaseTag = '${RELEASE_TAG}';
            data.releaseDate = new Date().toISOString().split('T')[0];
            data.downloadUrl = 'https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/sadsiyoon-v${VERSION}-release.apk';
            fs.writeFileSync('update.json', JSON.stringify(data, null, 2));
            fs.writeFileSync('public/update.json', JSON.stringify(data, null, 2));
          "

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: ${{ github.event.inputs.release_title || github.ref_name }}
          tag_name: ${{ github.ref_name || 'v1.7.0' }}
          draft: false
          prerelease: ${{ github.event.inputs.prerelease || false }}
          body_path: RELEASE_NOTES.md
          files: |
            release-artifacts/*.apk
            release-artifacts/*.sha256
            update.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

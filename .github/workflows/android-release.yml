name: Build and Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release_title:
        description: 'عنوان الإصدار (مثال: سادسيون v1.7.0)'
        required: false
        default: 'سادسيون — تحديث v1.7.0'
      prerelease:
        description: 'هل هذا الإصدار تجريبي؟'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Sadsiyoon APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci || npm install --legacy-peer-deps

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android

      - name: Set up Android SDK
        run: |
          echo "Setting up Android SDK environment..."
          ANDROID_PATH="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_PATH" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_PATH" >> $GITHUB_ENV
          export ANDROID_HOME="$ANDROID_PATH"
          export ANDROID_SDK_ROOT="$ANDROID_PATH"
          export PATH="$ANDROID_PATH/cmdline-tools/latest/bin:$ANDROID_PATH/platform-tools:$PATH"
          
          # Automatically accept all Android licenses
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          
          # Ensure target platform 35 and build-tools 35 are present
          sdkmanager "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true

      - name: Build Web App & Sync Capacitor
        run: |
          npm run build
          npx cap sync android
          # Ensure local.properties points directly to Android SDK
          echo "sdk.dir=${ANDROID_HOME:-/usr/local/lib/android/sdk}" > android/local.properties

      - name: Configure Keystore (if provided)
        run: |
          if [ -n "${{ secrets.SADSIYOON_KEYSTORE_BASE64 }}" ]; then
            echo "Using private signing keystore from secrets..."
            echo "${{ secrets.SADSIYOON_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          elif [ -f "debug.keystore.base64" ]; then
            echo "Using bundled debug keystore..."
            base64 -d debug.keystore.base64 > android/app/release.keystore 2>/dev/null || cat debug.keystore.base64 > android/app/release.keystore
          fi

      - name: Build Android APK (Gradle)
        env:
          SADSIYOON_KEYSTORE_PASSWORD: ${{ secrets.SADSIYOON_KEYSTORE_PASSWORD }}
          SADSIYOON_KEY_ALIAS: ${{ secrets.SADSIYOON_KEY_ALIAS }}
          SADSIYOON_KEY_PASSWORD: ${{ secrets.SADSIYOON_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease assembleDebug --stacktrace
          cd ..

      - name: Package & Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          VERSION="1.7.0"
          
          # Find and copy generated APKs
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp "android/app/build/outputs/apk/release/app-release.apk" "release-artifacts/sadsiyoon-v${VERSION}-release.apk"
            cp "android/app/build/outputs/apk/release/app-release.apk" "release-artifacts/sadsiyoon-release.apk"
          fi
          
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp "android/app/build/outputs/apk/debug/app-debug.apk" "release-artifacts/sadsiyoon-v${VERSION}-debug.apk"
            # If no release APK was generated, use debug APK as standard release
            if [ ! -f "release-artifacts/sadsiyoon-release.apk" ]; then
              cp "android/app/build/outputs/apk/debug/app-debug.apk" "release-artifacts/sadsiyoon-release.apk"
            fi
          fi
          
          # Fallback search if standard path differed
          if [ ! -f "release-artifacts/sadsiyoon-release.apk" ]; then
            FOUND_APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
            if [ -n "$FOUND_APK" ]; then
              echo "Discovered APK at $FOUND_APK"
              cp "$FOUND_APK" "release-artifacts/sadsiyoon-release.apk"
              cp "$FOUND_APK" "release-artifacts/sadsiyoon-v${VERSION}-release.apk"
            fi
          fi
          
          if [ ! -f "release-artifacts/sadsiyoon-release.apk" ]; then
            echo "ERROR: No APK generated by Gradle build" >&2
            exit 1
          fi
          
          # Checksum generation
          cd release-artifacts
          for apk in *.apk; do
            if [ -f "$apk" ]; then
              sha256sum "$apk" > "${apk}.sha256"
              echo "Checksum for $apk:"
              cat "${apk}.sha256"
            fi
          done
          cd ..

      - name: Update update.json Manifest
        run: |
          VERSION="1.7.0"
          RELEASE_TAG="${{ github.ref_name }}"
          if [ -z "$RELEASE_TAG" ] || [ "$RELEASE_TAG" = "main" ] || [ "$RELEASE_TAG" = "master" ]; then
            RELEASE_TAG="v${VERSION}"
          fi
          
          node -e "
            const fs = require('fs');
            const data = fs.existsSync('update.json') ? JSON.parse(fs.readFileSync('update.json', 'utf8')) : {};
            data.version = '${VERSION}';
            data.releaseTag = '${RELEASE_TAG}';
            data.releaseDate = new Date().toISOString().split('T')[0];
            data.downloadUrl = 'https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/sadsiyoon-release.apk';
            fs.writeFileSync('update.json', JSON.stringify(data, null, 2));
            if (fs.existsSync('public')) {
              fs.writeFileSync('public/update.json', JSON.stringify(data, null, 2));
            }
          "
          cp update.json release-artifacts/update.json

      - name: Upload APKs to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sadsiyoon-android-apk-v1.7.0
          path: |
            release-artifacts/*.apk
            release-artifacts/*.sha256
            update.json
          retention-days: 30
          if-no-files-found: warn

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch') && github.event_name != 'pull_request'
        with:
          name: ${{ github.event.inputs.release_title || 'سادسيون — Sadsiyoon v1.7.0' }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.7.0' }}
          draft: false
          prerelease: ${{ github.event.inputs.prerelease || false }}
          body_path: RELEASE_NOTES.md
          files: |
            release-artifacts/*.apk
            release-artifacts/*.sha256
            update.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

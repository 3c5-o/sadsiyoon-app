name: Manual Signed Sadsiyoon Release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      SADSIYOON_KEYSTORE_BASE64: ${{ secrets.SADSIYOON_KEYSTORE_BASE64 }}
      SADSIYOON_KEYSTORE_PASSWORD: ${{ secrets.SADSIYOON_KEYSTORE_PASSWORD }}
      SADSIYOON_KEY_ALIAS: ${{ secrets.SADSIYOON_KEY_ALIAS }}
      SADSIYOON_KEY_PASSWORD: ${{ secrets.SADSIYOON_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate private signing credentials
        shell: bash
        run: |
          test -n "$SADSIYOON_KEYSTORE_BASE64" || { echo "Missing keystore data secret"; exit 1; }
          test -n "$SADSIYOON_KEYSTORE_PASSWORD" || { echo "Missing keystore password secret"; exit 1; }
          test -n "$SADSIYOON_KEY_ALIAS" || { echo "Missing alias secret"; exit 1; }
          test -n "$SADSIYOON_KEY_PASSWORD" || { echo "Missing key password secret"; exit 1; }
      - name: Install keystore in temporary runner directory
        shell: bash
        run: |
          printf '%s' "$SADSIYOON_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sadsiyoon-release.jks"
          chmod 600 "$RUNNER_TEMP/sadsiyoon-release.jks"
          echo "SADSIYOON_KEYSTORE_FILE=$RUNNER_TEMP/sadsiyoon-release.jks" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Check source indexes and Android security configuration
        run: |
          python3 scripts/verify_catalogs.py
          python3 scripts/audit_sources.py
          python3 scripts/verify_release_security.py
      - name: Test student logic and build signed Release APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - name: Verify Android signing, production identity, and certificate
        shell: bash
        env:
          # Public certificate digest, set as a GitHub Actions *variable*
          # after checking the first approved release; never a private key.
          EXPECTED_SIGNER_SHA256: ${{ vars.SADSIYOON_EXPECTED_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER=$(find /usr/local/lib/android/sdk/build-tools -type f -name apksigner | sort -V | tail -n 1)
          AAPT=$(find /usr/local/lib/android/sdk/build-tools -type f -name aapt | sort -V | tail -n 1)
          test -n "$APKSIGNER" && test -n "$AAPT"
          REPORT="$GITHUB_WORKSPACE/app/build/outputs/apk/release/signing-report.txt"
          "$APKSIGNER" verify --verbose --print-certs --min-sdk-version 26 "$APK" > "$REPORT"
          cat "$REPORT"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$REPORT"
          CERT_SHA256=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$REPORT" | head -n 1)
          test -n "$CERT_SHA256"
          CERT_SHA256="${CERT_SHA256,,}"
          EXPECTED="${EXPECTED_SIGNER_SHA256,,}"
          EXPECTED="${EXPECTED//:/}"
          if [ -n "$EXPECTED" ] && [ "$CERT_SHA256" != "$EXPECTED" ]; then
            echo "Signing certificate changed unexpectedly. Refusing release."
            exit 1
          fi
          if [ -z "$EXPECTED" ]; then
            echo "NOTICE: Pin SADSIYOON_EXPECTED_CERT_SHA256 in GitHub Actions variables after the first approved certificate."
          fi
          PACKAGE=$("$AAPT" dump badging "$APK" | grep '^package:')
          echo "$PACKAGE"
          echo "$PACKAGE" | grep -Fq "name='com.sadsiyoon.app' "
          if "$AAPT" dump badging "$APK" | grep -q '^application-debuggable'; then
            echo "Refusing a debuggable production APK"
            exit 1
          fi
          (cd "$(dirname "$APK")" && sha256sum "$(basename "$APK")" > app-release.apk.sha256)
          {
            echo "### SADESION signed release"
            echo "Package: com.sadsiyoon.app"
            echo "Certificate SHA-256: $CERT_SHA256"
            echo "APK SHA-256: $(awk '{print $1}' "$(dirname "$APK")/app-release.apk.sha256")"
            echo "Play Protect verdict: NOT CHECKED by this CI job"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: sadsiyoon-stable-signed-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
            app/build/outputs/apk/release/signing-report.txt
          if-no-files-found: error
          retention-days: 90
      - name: Delete temporary signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/sadsiyoon-release.jks"

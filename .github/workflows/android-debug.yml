name: Android Debug CI & Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  validate-and-build:
    name: Validate and Build Android Preview APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Check TypeScript Compilation
        run: npm run lint

      - name: Build Web Production Assets
        run: npm run build

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android

      - name: Set up Android SDK
        run: |
          echo "Setting up Android SDK environment..."
          ANDROID_PATH="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_PATH" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_PATH" >> $GITHUB_ENV
          export ANDROID_HOME="$ANDROID_PATH"
          export ANDROID_SDK_ROOT="$ANDROID_PATH"
          export PATH="$ANDROID_PATH/cmdline-tools/latest/bin:$ANDROID_PATH/platform-tools:$PATH"
          
          # Automatically accept all Android licenses
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          
          # Ensure target platform 36 and build-tools 36 are present
          sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true

      - name: Sync Capacitor Android
        run: |
          npx cap sync android
          echo "sdk.dir=${ANDROID_HOME:-/usr/local/lib/android/sdk}" > android/local.properties

      - name: Build Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace
          cd ..

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sadsiyoon-preview-apk-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: warn

      - name: Verify Update Manifest
        run: |
          node -e "
            const fs = require('fs');
            const data = fs.existsSync('update.json') ? JSON.parse(fs.readFileSync('update.json', 'utf8')) : {};
            if (!data.version || !data.downloadUrl) {
              console.error('Invalid update.json manifest');
              process.exit(1);
            }
            console.log('Update manifest valid: version ' + data.version);
          "

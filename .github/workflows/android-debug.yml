name: Android Debug CI & Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-build:
    name: Validate Catalogs and Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Check TypeScript Compilation
        run: npm run lint

      - name: Build Web Production Assets
        run: npm run build

      - name: Verify Update Manifest
        run: |
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('update.json', 'utf8'));
            if (!data.version || !data.downloadUrl) {
              console.error('Invalid update.json manifest');
              process.exit(1);
            }
            console.log('Update manifest valid: version ' + data.version);
          "

name: Build Sadsiyoon APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Validate course catalogs
        run: python3 scripts/verify_catalogs.py
      - name: Audit source links and generate catalog health report
        run: python3 scripts/audit_sources.py
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify safe standalone preview application ID
        shell: bash
        run: |
          AAPT=$(find /usr/local/lib/android/sdk/build-tools -type f -name aapt | sort -V | tail -n 1)
          test -n "$AAPT"
          BADGING=$("$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk | head -n 1)
          echo "$BADGING"
          echo "$BADGING" | grep "name='com.sadsiyoon.app.preview'"
      - uses: actions/upload-artifact@v4
        with:
          name: sadsiyoon-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload catalog health reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sadsiyoon-catalog-health
          path: reports/catalog_health.*
          if-no-files-found: warn
          retention-days: 30

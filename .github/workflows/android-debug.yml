name: Android Debug CI & Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-build:
    name: Validate and Build Android Preview APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Check TypeScript Compilation
        run: npm run lint

      - name: Build Web Production Assets
        run: npm run build

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace
          cd ..

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sadsiyoon-preview-apk-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Verify Update Manifest
        run: |
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('update.json', 'utf8'));
            if (!data.version || !data.downloadUrl) {
              console.error('Invalid update.json manifest');
              process.exit(1);
            }
            console.log('Update manifest valid: version ' + data.version);
          "
